name: disk_kit
description: Flutter package providing a cross-platform API for disk management.
version: 0.0.2
homepage: https://byfox.eu
repository: https://github.com/Dark-Fox-PL/disk_kit/tree/main/packages/disk_kit
issue_tracker: https://github.com/Dark-Fox-PL/disk_kit/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  disk_kit_platform_interface: ^0.0.1
  disk_kit_macos: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        default_package: disk_kit_macos
