name: disk_kit_macos
description: macOS platform implementation for DiskKit using native macOS APIs.
version: 1.2.1
homepage: https://byfox.eu
repository: https://github.com/Dark-Fox-PL/disk_kit/tree/main/packages/disk_kit_macos
issue_tracker: https://github.com/Dark-Fox-PL/disk_kit/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  disk_kit_platform_interface: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    implements: disk_kit
    platforms:
      macos:
        pluginClass: DiskKitMacosPlugin
        dartPluginClass: DiskKitMacos
