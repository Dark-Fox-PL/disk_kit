name: disk_kit_macos_example
description: "Demonstrates how to use the disk_kit_macos plugin."
publish_to: 'none'

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  disk_kit_macos:
    path: ../

  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# Use the local interface package until it is published.
dependency_overrides:
  disk_kit_platform_interface:
    path: ../../disk_kit_platform_interface

flutter:

  uses-material-design: true
