name: disk_kit_macos_extensions
description: Optional macOS filesystem tools and volume access inspection for DiskKit.
version: 0.1.0
homepage: https://byfox.eu
repository: https://github.com/Dark-Fox-PL/disk_kit/tree/main/packages/disk_kit_macos_extensions
issue_tracker: https://github.com/Dark-Fox-PL/disk_kit/issues
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  disk_kit: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: DiskKitMacosExtensionsPlugin
